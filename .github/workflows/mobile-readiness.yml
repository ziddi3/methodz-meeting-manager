name: Mobile Readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate v1.6.7 wiring and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check config-v167.js
          node --check features-v167-device-readiness.js
          node --check tests/v167-mobile-readiness.spec.js
          grep -q 'features-v167.css' meeting.html
          grep -q 'config-v167.js' meeting.html
          grep -q 'features-v167-device-readiness.js' meeting.html
          grep -q 'config-v167.js' archive.html
          grep -q 'methodz-meeting-manager-v1.6.7' service-worker.js
          grep -q 'features-v167.css' service-worker.js
          grep -q 'config-v167.js' service-worker.js
          grep -q 'features-v167-device-readiness.js' service-worker.js
          grep -q 'appShellVersion = "1.6.7"' config-v167.js
          grep -q 'schemaVersion = "1.6.0"' config-v167.js
          grep -q 'sync-queue-portability.js' meeting.html
          grep -q 'features-v166-sync-portability.js' meeting.html
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --silent @playwright/test@1.53.2
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-mobile-http.log 2>&1 &
          echo $! > /tmp/methodz-mobile-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/meeting.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/methodz-mobile-http.log
          exit 1

      - name: Run mobile readiness browser tests
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/v167-mobile-readiness.spec.js --reporter=line

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: methodz-v167-mobile-readiness-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
