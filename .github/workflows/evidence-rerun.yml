name: Field Evidence Rerun Plan

on:
  pull_request:
    paths:
      - "evidence.html"
      - "evidence-remediation.js"
      - "evidence-rerun-core.js"
      - "evidence-rerun.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/EVIDENCE-RERUN-PLAN.md"
      - "docs/EVIDENCE-RERUN-PLAN-TESTS.md"
      - "docs/EVIDENCE-RERUN-PLAN-CHANGELOG.md"
      - "docs/V1.6.24-RELEASE-ROADMAP.md"
      - "tests/evidence-rerun-core.mjs"
      - "tests/evidence-rerun.spec.js"
      - ".github/workflows/evidence-rerun.yml"
  push:
    branches:
      - main
    paths:
      - "evidence.html"
      - "evidence-remediation.js"
      - "evidence-rerun-core.js"
      - "evidence-rerun.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/EVIDENCE-RERUN-PLAN.md"
      - "docs/EVIDENCE-RERUN-PLAN-TESTS.md"
      - "docs/EVIDENCE-RERUN-PLAN-CHANGELOG.md"
      - "docs/V1.6.24-RELEASE-ROADMAP.md"
      - "tests/evidence-rerun-core.mjs"
      - "tests/evidence-rerun.spec.js"
      - ".github/workflows/evidence-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-evidence-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static rerun boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            evidence.html
            evidence-remediation.js
            evidence-rerun-core.js
            evidence-rerun.js
            service-worker.js
            docs/APPLICATION-MAP.md
            docs/EVIDENCE-RERUN-PLAN.md
            docs/EVIDENCE-RERUN-PLAN-TESTS.md
            docs/EVIDENCE-RERUN-PLAN-CHANGELOG.md
            docs/V1.6.24-RELEASE-ROADMAP.md
            tests/evidence-rerun-core.mjs
            tests/evidence-rerun.spec.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

          node --check evidence-rerun-core.js
          node --check evidence-rerun.js
          node --check evidence-remediation.js
          node --check tests/evidence-rerun-core.mjs
          node --check tests/evidence-rerun.spec.js

          grep -q 'evidence-rerun-core.js' evidence.html
          grep -q 'evidence-rerun.js' evidence.html
          grep -q 'buildEvidenceRerunPlan' evidence.html
          grep -q 'methodz:evidence-remediation' evidence-remediation.js
          grep -q 'evidence-rerun-core.js' service-worker.js
          grep -q 'evidence-rerun.js' service-worker.js

          ! grep -Eq 'hub\.methodz\.ca' evidence-rerun-core.js evidence-rerun.js
          ! grep -Eq 'localStorage|sessionStorage|indexedDB' evidence-rerun-core.js evidence-rerun.js
          ! grep -Eq 'fetch\(|XMLHttpRequest|WebSocket|EventSource' evidence-rerun-core.js evidence-rerun.js
          ! grep -Eq 'saveMeeting\(|setRecords\(|replaceRecords\(|upsertRecord\(|deleteRecord\(|archiveRecord\(|provider\.write|synchroni[sz]e\(' evidence-rerun.js
          ! grep -Eq "addEventListener\\([\"']sync[\"']|periodicSync" evidence-rerun-core.js evidence-rerun.js service-worker.js

      - name: Run portable Field Evidence Rerun tests
        run: node tests/evidence-rerun-core.mjs

  chromium-evidence-rerun:
    runs-on: ubuntu-latest
    needs: portable-evidence-rerun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/evidence.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run Field Evidence Rerun browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/evidence-rerun.spec.js --reporter=line
