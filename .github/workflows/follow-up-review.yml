name: Live Meeting Pulse and Follow-Up Review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-review-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate review and focus static wiring
        shell: bash
        run: |
          set -euo pipefail
          required=(
            config-v1611.js meeting-review-core.js features-v1611-follow-up-review.js features-v1611.css
            tests/v1611-meeting-review.mjs tests/v1613-follow-up-focus.mjs tests/v1611-follow-up-review.spec.js
            docs/V1.6.11-ARCHITECTURE.md docs/V1.6.11-TESTS.md docs/V1.6.11-CHANGELOG.md
            docs/FOLLOW-UP-FOCUS.md docs/FOLLOW-UP-FOCUS-TESTS.md
          )
          for file in "${required[@]}"; do test -f "$file" || { echo "Missing $file"; exit 1; }; done
          node --check config-v1611.js
          node --check meeting-review-core.js
          node --check features-v1611-follow-up-review.js
          node --check tests/v1611-follow-up-review.spec.js
          grep -q 'appShellVersion = "1.6.11"' config-v1611.js
          grep -q 'schemaVersion = "1.6.0"' config-v1611.js
          grep -q 'version: "1.1.0"' config-v1611.js
          grep -q 'buildFollowUpFocus' meeting-review-core.js
          grep -q 'followUpFocusV1613' features-v1611-follow-up-review.js
          grep -q 'automaticReminderDelivery: false' config-v1611.js
          grep -q 'config-v1611.js' meeting.html
          grep -q 'meeting-review-core.js' meeting.html
          grep -q 'features-v1611-follow-up-review.js' meeting.html
          grep -q 'features-v1611.css' meeting.html
          grep -q 'methodz-meeting-manager-v1.6.11' service-worker.js
          ! grep -q 'addEventListener("sync"' service-worker.js
          ! grep -q "addEventListener('sync'" service-worker.js
          ! grep -q 'periodicSync' service-worker.js
          ! grep -Eq 'hub\.methodz\.ca' meeting.html archive.html verify.html manifest.webmanifest service-worker.js
      - name: Run portable review tests
        run: |
          node tests/v1611-meeting-review.mjs
          node tests/v1613-follow-up-focus.mjs

  chromium-review-workflow:
    runs-on: ubuntu-latest
    needs: portable-review-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/meeting.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run review and focus browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/v1611-follow-up-review.spec.js --reporter=line
