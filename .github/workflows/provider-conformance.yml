name: Hosted Provider Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract:
    name: Provider contract and reference adapters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify provider contract assets and current shell
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            config-v163.js config-v164.js config-v165.js config-v166.js config-v167.js config-v168.js config-v169.js config-v1610.js
            provider-contract.js hosted-provider-adapters.js provider-conformance.js tests/v163-provider-core.mjs
            docs/V1.6.3-PROVIDER-CONTRACT.md
          )
          for file in "${required_files[@]}"; do test -f "$file" || exit 1; done
          grep -q 'appShellVersion = "1.6.3"' config-v163.js
          grep -q 'appShellVersion = "1.6.10"' config-v1610.js
          grep -q 'schemaVersion = "1.6.0"' config-v1610.js
          grep -q 'provider-contract.js' meeting.html
          grep -q 'hosted-provider-adapters.js' meeting.html
          grep -q 'config-v1610.js' meeting.html
          grep -q 'methodz-meeting-manager-v1.6.10' service-worker.js
          grep -q 'config-v1610.js' service-worker.js
          grep -q 'provider-contract.js' service-worker.js
          grep -q 'hosted-provider-adapters.js' service-worker.js

      - name: Check provider JavaScript syntax
        run: |
          node --check provider-contract.js
          node --check hosted-provider-adapters.js
          node --check provider-conformance.js
          node --check tests/v163-provider-core.mjs

      - name: Run reusable provider conformance suite
        run: node tests/v163-provider-core.mjs
