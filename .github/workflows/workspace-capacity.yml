name: Workspace Capacity and Performance Rehearsal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-capacity-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate v1.6.12 static wiring
        shell: bash
        run: |
          set -euo pipefail
          required=(
            config-v1612.js workspace-capacity-core.js features-v1612-workspace-capacity.js features-v1612.css
            tests/v1612-workspace-capacity.mjs tests/v1612-workspace-capacity.spec.js
            docs/V1.6.12-ARCHITECTURE.md docs/V1.6.12-TESTS.md docs/V1.6.12-CHANGELOG.md
          )
          for file in "${required[@]}"; do test -f "$file" || { echo "Missing $file"; exit 1; }; done
          node --check config-v1612.js
          node --check workspace-capacity-core.js
          node --check features-v1612-workspace-capacity.js
          grep -q 'appShellVersion = "1.6.12"' config-v1612.js
          grep -q 'schemaVersion = "1.6.0"' config-v1612.js
          grep -q 'config-v1612.js' meeting.html
          grep -q 'workspace-capacity-core.js' meeting.html
          grep -q 'features-v1612-workspace-capacity.js' meeting.html
          grep -q 'features-v1612.css' meeting.html
          grep -q 'methodz-meeting-manager-v1.6.12' service-worker.js
          ! grep -q 'addEventListener("sync"' service-worker.js
          ! grep -q "addEventListener('sync'" service-worker.js
          ! grep -q 'periodicSync' service-worker.js
          ! grep -Eq 'hub\.methodz\.ca' meeting.html archive.html verify.html manifest.webmanifest service-worker.js
      - name: Run portable capacity tests
        run: node tests/v1612-workspace-capacity.mjs

  chromium-capacity-workflow:
    runs-on: ubuntu-latest
    needs: portable-capacity-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/meeting.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run v1.6.12 browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/v1612-workspace-capacity.spec.js --reporter=line
