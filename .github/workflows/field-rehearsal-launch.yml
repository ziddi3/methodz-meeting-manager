name: Field Rehearsal Launch Handoff

on:
  pull_request:
    paths:
      - "evidence.html"
      - "evidence-rerun.js"
      - "rehearsal.html"
      - "field-rehearsal.js"
      - "field-rehearsal-launch-core.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/FIELD-REHEARSAL-HANDOFF.md"
      - "docs/FIELD-REHEARSAL-HANDOFF-TESTS.md"
      - "docs/FIELD-REHEARSAL-HANDOFF-CHANGELOG.md"
      - "docs/V1.6.25-RELEASE-ROADMAP.md"
      - "tests/field-rehearsal-launch-core.mjs"
      - "tests/field-rehearsal-launch.spec.js"
      - ".github/workflows/field-rehearsal-launch.yml"
  push:
    branches:
      - main
    paths:
      - "evidence.html"
      - "evidence-rerun.js"
      - "rehearsal.html"
      - "field-rehearsal.js"
      - "field-rehearsal-launch-core.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/FIELD-REHEARSAL-HANDOFF.md"
      - "docs/FIELD-REHEARSAL-HANDOFF-TESTS.md"
      - "docs/FIELD-REHEARSAL-HANDOFF-CHANGELOG.md"
      - "docs/V1.6.25-RELEASE-ROADMAP.md"
      - "tests/field-rehearsal-launch-core.mjs"
      - "tests/field-rehearsal-launch.spec.js"
      - ".github/workflows/field-rehearsal-launch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-field-rehearsal-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static rehearsal-launch boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            evidence.html
            evidence-rerun.js
            rehearsal.html
            field-rehearsal.js
            field-rehearsal-launch-core.js
            service-worker.js
            docs/APPLICATION-MAP.md
            docs/FIELD-REHEARSAL-HANDOFF.md
            docs/FIELD-REHEARSAL-HANDOFF-TESTS.md
            docs/FIELD-REHEARSAL-HANDOFF-CHANGELOG.md
            docs/V1.6.25-RELEASE-ROADMAP.md
            tests/field-rehearsal-launch-core.mjs
            tests/field-rehearsal-launch.spec.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

          node --check field-rehearsal-launch-core.js
          node --check evidence-rerun.js
          node --check field-rehearsal.js
          node --check tests/field-rehearsal-launch-core.mjs
          node --check tests/field-rehearsal-launch.spec.js

          grep -q 'field-rehearsal-launch-core.js' evidence.html
          grep -q 'field-rehearsal-launch-core.js' rehearsal.html
          grep -q 'field-rehearsal-launch-core.js' service-worker.js
          grep -q 'evidenceRerunTargetCommit' evidence.html
          grep -q 'rehearsalLaunchCard' rehearsal.html
          grep -q 'Open Rehearsal' evidence-rerun.js

          ! grep -Eq 'localStorage|sessionStorage|indexedDB' field-rehearsal-launch-core.js evidence-rerun.js field-rehearsal.js
          ! grep -Eq 'fetch\(|XMLHttpRequest|WebSocket|EventSource' field-rehearsal-launch-core.js evidence-rerun.js field-rehearsal.js
          ! grep -Eq 'saveMeeting\(|setRecords\(|replaceRecords\(|upsertRecord\(|deleteRecord\(|archiveRecord\(|provider\.write|synchroni[sz]e\(' evidence-rerun.js field-rehearsal.js
          ! grep -Eq 'hub\.methodz\.ca' field-rehearsal-launch-core.js evidence-rerun.js field-rehearsal.js
          ! grep -Eq "addEventListener\\([\"']sync[\"']|periodicSync" field-rehearsal-launch-core.js evidence-rerun.js field-rehearsal.js service-worker.js

      - name: Run portable Field Rehearsal launch tests
        run: node tests/field-rehearsal-launch-core.mjs

  chromium-field-rehearsal-launch:
    runs-on: ubuntu-latest
    needs: portable-field-rehearsal-launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/evidence.html > /dev/null && curl --fail --silent http://127.0.0.1:4173/rehearsal.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run Field Rehearsal launch browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/field-rehearsal-launch.spec.js --reporter=line
