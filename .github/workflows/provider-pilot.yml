name: Hosted Provider Pilot

on:
  push:
    branches: [main]
    paths:
      - "provider-contract.js"
      - "hosted-provider-adapters.js"
      - "provider-conformance.js"
      - "http-provider-pilot.js"
      - "sync-rehearsal-core.js"
      - "sync-rehearsal-hardening.js"
      - "config-v164.js"
      - "config-v165.js"
      - "config-v166.js"
      - "config-v167.js"
      - "meeting.html"
      - "archive.html"
      - "service-worker.js"
      - "tests/v164-provider-pilot.mjs"
      - "tests/v165-sync-rehearsal.mjs"
      - "docs/V1.6.4-PROVIDER-PILOT.md"
      - "docs/V1.6.5-SYNC-REHEARSAL.md"
      - "docs/PRODUCTION-PROVIDER-EVIDENCE.md"
      - ".github/workflows/provider-pilot.yml"
  pull_request:
    paths:
      - "provider-contract.js"
      - "hosted-provider-adapters.js"
      - "provider-conformance.js"
      - "http-provider-pilot.js"
      - "sync-rehearsal-core.js"
      - "sync-rehearsal-hardening.js"
      - "config-v164.js"
      - "config-v165.js"
      - "config-v166.js"
      - "config-v167.js"
      - "meeting.html"
      - "archive.html"
      - "service-worker.js"
      - "tests/v164-provider-pilot.mjs"
      - "tests/v165-sync-rehearsal.mjs"
      - "docs/V1.6.4-PROVIDER-PILOT.md"
      - "docs/V1.6.5-SYNC-REHEARSAL.md"
      - "docs/PRODUCTION-PROVIDER-EVIDENCE.md"
      - ".github/workflows/provider-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serialized-provider-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pilot JavaScript syntax
        run: |
          set -euo pipefail
          node --check http-provider-pilot.js
          node --check sync-rehearsal-core.js
          node --check sync-rehearsal-hardening.js
          node --check config-v164.js
          node --check config-v165.js
          node --check config-v166.js
          node --check config-v167.js
          node --check tests/v164-provider-pilot.mjs
          node --check tests/v165-sync-rehearsal.mjs

      - name: Run disposable HTTP-style provider pilot
        run: node tests/v164-provider-pilot.mjs

      - name: Verify production boundary and release wiring
        run: |
          set -euo pipefail
          ! grep -Eiq "https://[^[:space:]\"']*(firebase|supabase)" http-provider-pilot.js sync-rehearsal-core.js sync-rehearsal-hardening.js tests/v164-provider-pilot.mjs tests/v165-sync-rehearsal.mjs config-v164.js config-v165.js config-v166.js config-v167.js
          ! grep -Eq 'http-provider-pilot\.js|sync-rehearsal-core\.js|sync-rehearsal-hardening\.js' archive.html verify.html
          grep -q 'http-provider-pilot.js' meeting.html
          grep -q 'sync-rehearsal-core.js' meeting.html
          grep -q 'sync-rehearsal-hardening.js' meeting.html
          grep -q 'config-v165.js' meeting.html
          grep -q 'config-v166.js' meeting.html
          grep -q 'config-v167.js' meeting.html
          grep -q 'config-v167.js' archive.html
          grep -q 'config-v167.js' service-worker.js
          grep -q 'appShellVersion = "1.6.5"' config-v165.js
          grep -q 'appShellVersion = "1.6.6"' config-v166.js
          grep -q 'appShellVersion = "1.6.7"' config-v167.js
          grep -q 'automaticBackgroundSync: false' config-v166.js
          grep -q 'productionEndpointConfigured: false' config-v167.js
          grep -q 'productionCredentialsAllowed: false' config-v166.js
          grep -q 'methodz-meeting-manager-v1.6.7' service-worker.js
          grep -q 'no backend' docs/V1.6.4-PROVIDER-PILOT.md
          grep -q 'Authentication' docs/PRODUCTION-PROVIDER-EVIDENCE.md
