name: Field Rehearsal Evidence

on:
  pull_request:
    paths:
      - "index.html"
      - "rehearsal.html"
      - "field-rehearsal-core.js"
      - "field-rehearsal.js"
      - "field-rehearsal.css"
      - "service-worker.js"
      - "docs/FIELD-REHEARSAL-WORKSPACE.md"
      - "docs/FIELD-REHEARSAL-WORKSPACE-TESTS.md"
      - "docs/FIELD-REHEARSAL-WORKSPACE-CHANGELOG.md"
      - "docs/V1.6.20-RELEASE-ROADMAP.md"
      - "tests/field-rehearsal-core.mjs"
      - "tests/field-rehearsal.spec.js"
      - ".github/workflows/field-rehearsal.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "rehearsal.html"
      - "field-rehearsal-core.js"
      - "field-rehearsal.js"
      - "field-rehearsal.css"
      - "service-worker.js"
      - "docs/FIELD-REHEARSAL-WORKSPACE.md"
      - "docs/FIELD-REHEARSAL-WORKSPACE-TESTS.md"
      - "docs/FIELD-REHEARSAL-WORKSPACE-CHANGELOG.md"
      - "docs/V1.6.20-RELEASE-ROADMAP.md"
      - "tests/field-rehearsal-core.mjs"
      - "tests/field-rehearsal.spec.js"
      - ".github/workflows/field-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-field-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static field-rehearsal boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            rehearsal.html
            field-rehearsal-core.js
            field-rehearsal.js
            field-rehearsal.css
            service-worker.js
            docs/FIELD-REHEARSAL-WORKSPACE.md
            docs/FIELD-REHEARSAL-WORKSPACE-TESTS.md
            docs/FIELD-REHEARSAL-WORKSPACE-CHANGELOG.md
            docs/V1.6.20-RELEASE-ROADMAP.md
            tests/field-rehearsal-core.mjs
            tests/field-rehearsal.spec.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

          node --check field-rehearsal-core.js
          node --check field-rehearsal.js
          node --check tests/field-rehearsal-core.mjs
          node --check tests/field-rehearsal.spec.js

          grep -q 'rehearsal.html' index.html
          grep -q 'field-rehearsal.css' rehearsal.html
          grep -q 'field-rehearsal-core.js' rehearsal.html
          grep -q 'field-rehearsal.js' rehearsal.html
          grep -q 'rehearsal.html' service-worker.js
          grep -q 'field-rehearsal.css' service-worker.js
          grep -q 'field-rehearsal-core.js' service-worker.js
          grep -q 'field-rehearsal.js' service-worker.js

          ! grep -Eq 'hub\.methodz\.ca' rehearsal.html field-rehearsal-core.js field-rehearsal.js field-rehearsal.css
          ! grep -Eq 'localStorage|sessionStorage|indexedDB' field-rehearsal-core.js field-rehearsal.js
          ! grep -Eq 'saveMeeting\(|setRecords\(|replaceRecords\(|upsertRecord\(|deleteRecord\(|archiveRecord\(|provider\.write|synchroni[sz]e\(' field-rehearsal.js
          ! grep -Eq "addEventListener\\([\"']sync[\"']|periodicSync" field-rehearsal-core.js field-rehearsal.js service-worker.js

      - name: Run portable Field Rehearsal tests
        run: node tests/field-rehearsal-core.mjs

  chromium-field-rehearsal:
    runs-on: ubuntu-latest
    needs: portable-field-rehearsal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/rehearsal.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run Field Rehearsal browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/field-rehearsal.spec.js --reporter=line
