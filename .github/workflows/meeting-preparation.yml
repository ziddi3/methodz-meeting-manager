name: Meeting Preparation Brief

on:
  pull_request:
    paths:
      - "meeting-preparation-core.js"
      - "meeting-preparation.js"
      - "meeting-preparation.css"
      - "meeting-preparation-launch-core.js"
      - "features-v1614-preparation-launch.js"
      - "features-v1614-preparation-launch.css"
      - "preparation.html"
      - "meeting.html"
      - "service-worker.js"
      - "tests/meeting-preparation-core.mjs"
      - "tests/meeting-preparation-launch-core.mjs"
      - "tests/meeting-preparation-launch.spec.js"
      - "docs/MEETING-PREPARATION-BRIEF.md"
      - "docs/MEETING-PREPARATION-BRIEF-TESTS.md"
      - "docs/MEETING-PREPARATION-LAUNCH.md"
      - "docs/MEETING-PREPARATION-LAUNCH-TESTS.md"
      - ".github/workflows/meeting-preparation.yml"
  push:
    branches:
      - main
    paths:
      - "meeting-preparation-core.js"
      - "meeting-preparation.js"
      - "meeting-preparation.css"
      - "meeting-preparation-launch-core.js"
      - "features-v1614-preparation-launch.js"
      - "features-v1614-preparation-launch.css"
      - "preparation.html"
      - "meeting.html"
      - "service-worker.js"
      - "tests/meeting-preparation-core.mjs"
      - "tests/meeting-preparation-launch-core.mjs"
      - "tests/meeting-preparation-launch.spec.js"
      - "docs/MEETING-PREPARATION-BRIEF.md"
      - "docs/MEETING-PREPARATION-BRIEF-TESTS.md"
      - "docs/MEETING-PREPARATION-LAUNCH.md"
      - "docs/MEETING-PREPARATION-LAUNCH-TESTS.md"
      - ".github/workflows/meeting-preparation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-preparation-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static preparation workspace
        shell: bash
        run: |
          set -euo pipefail
          required=(
            meeting-preparation-core.js
            meeting-preparation.js
            meeting-preparation.css
            meeting-preparation-launch-core.js
            features-v1614-preparation-launch.js
            features-v1614-preparation-launch.css
            preparation.html
            meeting.html
            service-worker.js
            tests/meeting-preparation-core.mjs
            tests/meeting-preparation-launch-core.mjs
            tests/meeting-preparation-launch.spec.js
            docs/MEETING-PREPARATION-BRIEF.md
            docs/MEETING-PREPARATION-BRIEF-TESTS.md
            docs/MEETING-PREPARATION-LAUNCH.md
            docs/MEETING-PREPARATION-LAUNCH-TESTS.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

          node --check meeting-preparation-core.js
          node --check meeting-preparation.js
          node --check meeting-preparation-launch-core.js
          node --check features-v1614-preparation-launch.js
          node --check tests/meeting-preparation-core.mjs
          node --check tests/meeting-preparation-launch-core.mjs
          node --check tests/meeting-preparation-launch.spec.js

          grep -q 'data-adapter.js' preparation.html
          grep -q 'meeting-preparation-core.js' preparation.html
          grep -q 'meeting-preparation-launch-core.js' preparation.html
          grep -q 'meeting-preparation.js' preparation.html
          grep -q 'features-v1614-preparation-launch.js' preparation.html
          grep -q 'features-v1614-preparation-launch.css' preparation.html
          grep -q 'meeting-preparation-launch-core.js' meeting.html
          grep -q 'features-v1614-preparation-launch.js' meeting.html
          grep -q 'features-v1614-preparation-launch.css' meeting.html
          grep -q 'Return to Meeting Manager' preparation.html
          grep -q 'buildMeetingPreparationBrief' meeting-preparation-core.js
          grep -q 'createPreparationLaunchHash' meeting-preparation-launch-core.js
          grep -q 'parsePreparationLaunchHash' meeting-preparation-launch-core.js
          grep -q 'MethodzMeetingData.listRecords' meeting-preparation.js
          grep -q 'Open Meeting to Prepare' features-v1614-preparation-launch.js
          grep -q 'Back to Preparation Brief' features-v1614-preparation-launch.js
          grep -q 'preparation.html' service-worker.js
          grep -q 'meeting-preparation-launch-core.js' service-worker.js
          grep -q 'features-v1614-preparation-launch.js' service-worker.js
          grep -q 'features-v1614-preparation-launch.css' service-worker.js
          grep -q 'Download CSV' preparation.html

          ! grep -Eq 'hub\.methodz\.ca' preparation.html meeting.html meeting-preparation.js meeting-preparation-core.js meeting-preparation-launch-core.js features-v1614-preparation-launch.js features-v1614-preparation-launch.css
          ! grep -Eq 'setRecords\(|replaceRecords\(|upsertRecord\(|deleteRecord\(|saveMeeting\(|archiveRecord\(' features-v1614-preparation-launch.js
          ! grep -Eq 'localStorage\.setItem|sessionStorage\.setItem' features-v1614-preparation-launch.js
          ! grep -Eq "addEventListener\\([\"']sync[\"']|periodicSync" preparation.html meeting-preparation.js meeting-preparation-core.js meeting-preparation-launch-core.js features-v1614-preparation-launch.js service-worker.js

      - name: Run portable preparation tests
        run: |
          node tests/meeting-preparation-core.mjs
          node tests/meeting-preparation-launch-core.mjs

  chromium-preparation-launch:
    runs-on: ubuntu-latest
    needs: portable-preparation-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/preparation.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run preparation launch browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/meeting-preparation-launch.spec.js --reporter=line
