name: Field Rehearsal Return Handoff

on:
  pull_request:
    paths:
      - "rehearsal.html"
      - "field-rehearsal.js"
      - "field-evidence-integrity-core.js"
      - "field-rehearsal-return-core.js"
      - "field-rehearsal-return.js"
      - "evidence.html"
      - "evidence-coverage.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF-TESTS.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF-CHANGELOG.md"
      - "docs/V1.6.27-RELEASE-ROADMAP.md"
      - "tests/field-evidence-integrity-core.mjs"
      - "tests/field-rehearsal-return-core.mjs"
      - "tests/field-rehearsal-return.spec.js"
      - ".github/workflows/field-rehearsal-return.yml"
  push:
    branches:
      - main
    paths:
      - "rehearsal.html"
      - "field-rehearsal.js"
      - "field-evidence-integrity-core.js"
      - "field-rehearsal-return-core.js"
      - "field-rehearsal-return.js"
      - "evidence.html"
      - "evidence-coverage.js"
      - "service-worker.js"
      - "docs/APPLICATION-MAP.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF-TESTS.md"
      - "docs/FIELD-REHEARSAL-RETURN-HANDOFF-CHANGELOG.md"
      - "docs/V1.6.27-RELEASE-ROADMAP.md"
      - "tests/field-evidence-integrity-core.mjs"
      - "tests/field-rehearsal-return-core.mjs"
      - "tests/field-rehearsal-return.spec.js"
      - ".github/workflows/field-rehearsal-return.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-field-rehearsal-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static rehearsal-return boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            rehearsal.html
            field-rehearsal.js
            field-evidence-integrity-core.js
            field-rehearsal-return-core.js
            field-rehearsal-return.js
            evidence.html
            evidence-coverage.js
            service-worker.js
            docs/APPLICATION-MAP.md
            docs/FIELD-REHEARSAL-RETURN-HANDOFF.md
            docs/FIELD-REHEARSAL-RETURN-HANDOFF-TESTS.md
            docs/FIELD-REHEARSAL-RETURN-HANDOFF-CHANGELOG.md
            docs/V1.6.27-RELEASE-ROADMAP.md
            tests/field-evidence-integrity-core.mjs
            tests/field-rehearsal-return-core.mjs
            tests/field-rehearsal-return.spec.js
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done

          node --check field-evidence-integrity-core.js
          node --check field-rehearsal-return-core.js
          node --check field-rehearsal-return.js
          node --check field-rehearsal.js
          node --check evidence-coverage.js
          node --check tests/field-evidence-integrity-core.mjs
          node --check tests/field-rehearsal-return-core.mjs
          node --check tests/field-rehearsal-return.spec.js

          grep -q 'field-evidence-integrity-core.js' rehearsal.html
          grep -q 'field-rehearsal-return-core.js' rehearsal.html
          grep -q 'field-rehearsal-return.js' rehearsal.html
          grep -q 'field-evidence-integrity-core.js' evidence.html
          grep -q 'field-rehearsal-return-core.js' evidence.html
          grep -q 'field-rehearsal-return.js' evidence.html
          grep -q 'field-evidence-integrity-core.js' service-worker.js
          grep -q 'field-rehearsal-return-core.js' service-worker.js
          grep -q 'field-rehearsal-return.js' service-worker.js
          grep -q 'returnToCoverage' rehearsal.html
          grep -q 'returnCoverageReceipt' evidence.html
          grep -q 'methodz:field-rehearsal-downloaded' field-rehearsal.js
          grep -q 'methodz:evidence-receipt-verification' evidence-coverage.js

          ! grep -Eq 'localStorage|sessionStorage|indexedDB' field-evidence-integrity-core.js field-rehearsal-return-core.js field-rehearsal-return.js
          ! grep -Eq 'fetch\(|XMLHttpRequest|WebSocket|EventSource' field-evidence-integrity-core.js field-rehearsal-return-core.js field-rehearsal-return.js
          ! grep -Eq 'saveMeeting\(|setRecords\(|replaceRecords\(|upsertRecord\(|deleteRecord\(|archiveRecord\(|provider\.write|synchroni[sz]e\(' field-rehearsal-return.js evidence-coverage.js
          ! grep -Eq 'hub\.methodz\.ca' field-evidence-integrity-core.js field-rehearsal-return-core.js field-rehearsal-return.js evidence-coverage.js
          ! grep -Eq "addEventListener\\([\"']sync[\"']|periodicSync" field-evidence-integrity-core.js field-rehearsal-return-core.js field-rehearsal-return.js service-worker.js

      - name: Run portable Field Evidence integrity tests
        run: node tests/field-evidence-integrity-core.mjs
      - name: Run portable Field Rehearsal return tests
        run: node tests/field-rehearsal-return-core.mjs

  chromium-field-rehearsal-return:
    runs-on: ubuntu-latest
    needs: portable-field-rehearsal-return
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --silent @playwright/test@1.53.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methodz-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/evidence.html > /dev/null && curl --fail --silent http://127.0.0.1:4173/rehearsal.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/methodz-http.log
          exit 1
      - name: Run Field Rehearsal return browser coverage
        env:
          METHODZ_BROWSER: chromium
        run: npx playwright test tests/field-rehearsal-return.spec.js --reporter=line
